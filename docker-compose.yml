# LMS system — production-style deployment.
#
# Services:
#   postgres     backend database
#   rustfs       S3-compatible object store for file uploads (same as prod)
#   rustfs-init  one-shot: creates the upload bucket
#   lms-server   Go backend (api :8065, metrics :8067)
#   lms-fe       Next.js frontend (:3000), proxies /api/v4/* -> lms-server
#   dev-proxy    Caddy reverse proxy (:80) — single origin for REST + WS (chat)
#   prometheus   scrapes lms-server metrics
#   grafana      dashboards (read from prometheus)
#
# Configure via the .env file (see .env.example).
# Start:   docker compose up -d
# Logs:    docker compose logs -f lms-server
# Stop:    docker compose down
#
# NOTE: this file mirrors the production Swarm stack (deploy/swarm/stack.yml)
# — rustfs for object storage, same env-var names — so local dev behaves
# like prod. For the production deployment see DEPLOY.md.

name: lms

services:
  # ─────────────────────────── Database ───────────────────────────
  postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mmuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mattermost}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-mmuser} -d ${POSTGRES_DB:-mattermost}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms-net

  # ─────────────────────── Object storage (S3) ────────────────────
  # RustFS — same engine as the production Swarm stack. The console has its
  # own login (the access/secret key pair).
  rustfs:
    image: rustfs/rustfs:1.0.0-rc.4
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-lms}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: "warn"
    volumes:
      - rustfs_data:/data
    ports:
      # rustfs console (object browser) — restrict/remove in hardened prod
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lms-net

  # One-shot bucket creator. Retries until rustfs answers (compose
  # depends_on is honored here, but the retry loop is harmless and matches
  # the Swarm init job). Exits 0 when done.
  rustfs-init:
    image: minio/mc:RELEASE.2025-02-08T19-14-10Z
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      set -e;
      mc alias set local http://rustfs:9000 ${RUSTFS_ACCESS_KEY:-lms} ${RUSTFS_SECRET_KEY};
      mc mb --ignore-existing local/${MM_FILESETTINGS_AMAZONS3_BUCKET:-lms-uploads};
      echo '>> bucket ready';
      exit 0;
      "
    networks:
      - lms-net

  # ─────────────────────────── Backend ────────────────────────────
  lms-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    environment:
      # ── Database ──
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: ${MM_SQLSETTINGS_DATASOURCE:?Set MM_SQLSETTINGS_DATASOURCE in .env}

      # ── File storage -> rustfs (S3-compatible; path-style is used
      #    automatically for non-AWS endpoints) ──
      MM_FILESETTINGS_DRIVERNAME: amazons3
      MM_FILESETTINGS_AMAZONS3ACCESSKEYID: ${RUSTFS_ACCESS_KEY:-lms}
      MM_FILESETTINGS_AMAZONS3SECRETACCESSKEY: ${RUSTFS_SECRET_KEY}
      MM_FILESETTINGS_AMAZONS3BUCKET: ${MM_FILESETTINGS_AMAZONS3_BUCKET:-lms-uploads}
      MM_FILESETTINGS_AMAZONS3ENDPOINT: http://rustfs:9000
      MM_FILESETTINGS_AMAZONS3SSL: "false"
      MM_FILESETTINGS_AMAZONS3REGION: us-east-1

      # ── Metrics ──
      MM_METRICSSETTINGS_ENABLE: "true"
      MM_METRICSSETTINGS_LISTENADDRESS: ":8067"

      # ── Misc ──
      MM_SERVICESETTINGS_SITEURL: ${MM_SERVICESETTINGS_SITEURL:-http://localhost:8065}
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_SERVICESETTINGS_ALLOWCORSFROM: ${MM_SERVICESETTINGS_ALLOWCORSFROM:-http://localhost:3001}
      MM_SERVICESETTINGS_ALLOWEDUNTRUSTEDINTERNALCONNECTIONS: "rustfs,postgres"
      MM_NO_DOCKER: "true"
      MM_INSTALL_TYPE: docker
      TZ: ${TZ:-UTC}
    volumes:
      - mmdata:/mattermost/data
      - mmlogs:/mattermost/logs
      - mmconfig:/mattermost/config
    ports:
      - "${BACKEND_PORT:-8065}:8065"
    expose:
      - "8067" # metrics (scraped by prometheus on the internal network)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8065/api/v4/system/ping"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - lms-net

  # ─────────────────────────── Frontend ───────────────────────────
  lms-fe:
    build:
      context: ./lms-fe
      dockerfile: Dockerfile
      args:
        # "/" is the same-origin sentinel (see lms-fe/Dockerfile): the browser
        # talks to /api/v4/* through the dev-proxy (Caddy) on ONE origin, so
        # the httpOnly cookie works for REST and the WebSocket alike. This
        # mirrors the production Traefik path rule exactly.
        NEXT_PUBLIC_API_URL: /
    restart: unless-stopped
    depends_on:
      lms-server:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: ${TZ:-UTC}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - lms-net

  # ───────────────────────── Dev reverse proxy ──────────────────────
  # Caddy serves the whole app on a single origin (http://localhost) so that
  # the httpOnly MMAUTHTOKEN cookie is first-party for BOTH REST and the
  # WebSocket (/api/v4/websocket). This mirrors the prod Traefik path rule
  # and makes real-time chat work in dev without CORS/cookie gymnastics.
  # Use http://localhost (PROXY_PORT) for local dev; the browser then talks
  # same-origin for everything and NEXT_PUBLIC_API_URL is unused client-side.
  # Path routing rules live in deploy/caddy/Caddyfile.
  dev-proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - lms-fe
      - lms-server
    ports:
      - "${PROXY_PORT:-80}:80"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - lms-net

  # ─────────────────────── Observability ──────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    expose:
      - "9090"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - lms-server
    networks:
      - lms-net

  grafana:
    image: grafana/grafana:10.4.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      # Auto-provision Prometheus datasource + dashboard provider
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      # Drop dashboard JSON files here to have them auto-loaded
      - grafana-dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    ports:
      # 3001 to avoid clashing with the frontend on 3000
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    networks:
      - lms-net

networks:
  lms-net:
    driver: bridge

volumes:
  pgdata:
  rustfs_data:
  mmdata:
  mmlogs:
  mmconfig:
  promdata:
  grafana-data:
  grafana-dashboards:
