# Local development dependencies for `make run-server`.
#
# Services:
#   - postgres   (SqlSettings: mmuser:mostest@mattermost_test)
#   - minio      (S3-compatible file storage on :9000, console on :9001)
#   - prometheus (metrics scraper on :9090, scrapes server on host:8067)
#
# Start with:
#   make start-docker
# or:
#   docker compose -f build/docker-compose.dev.yml up -d
#
# The credentials here are dev defaults — NOT production secrets.
name: lms-dev

services:
  postgres:
    image: postgres:14-alpine
    container_name: lms-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: mostest
      POSTGRES_DB: mattermost_test
    ports:
      - "5432:5432"
    volumes:
      - lms-dev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmuser -d mattermost_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: lms-dev-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - lms-dev-miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: lms-dev-minio-init
    profiles:
      - setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/lms-dev;
        mc anonymous set download local/lms-dev;
      "

  prometheus:
    image: prom/prometheus:latest
    container_name: lms-dev-prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    volumes:
      - ../../observability/prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  lms-dev-pgdata:
  lms-dev-miniodata:
