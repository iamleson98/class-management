# Local development dependencies for `make run-server`.
#
# Services:
#   postgres   (SqlSettings: mmuser:mostest@mattermost_test)
#   rustfs     (S3-compatible file storage on :9000, console on :9001)
#   prometheus (metrics scraper on :9090, scrapes server on host:8067)
#
# Start with:
#   make start-docker
# or:
#   docker compose -f build/docker-compose.dev.yml up -d
#
# The credentials here are dev defaults — NOT production secrets.
name: lms-dev

services:
  postgres:
    image: postgres:14-alpine
    container_name: lms-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: mostest
      POSTGRES_DB: mattermost_test
    ports:
      - "5432:5432"
    volumes:
      - lms-dev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmuser -d mattermost_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  # RustFS — S3-compatible object storage (same engine as the production
  # stack). The dev credentials match the test constants in
  # public/model/config.go (RustFSAccessKey / RustFSSecretKey), so the
  # filestore test suite can run against this instance with
  # CI_RUSTFS_HOST=localhost CI_RUSTFS_PORT=9000.
  rustfs:
    image: rustfs/rustfs:1.0.0-rc.4
    container_name: lms-dev-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: rustfsaccesskey
      RUSTFS_SECRET_KEY: rustfssecretkey
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: "warn"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - lms-dev-rustfsdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot bucket creator (rustfs/rc is the official RustFS S3 CLI,
  # mc-compatible: alias set / mb / anonymous). Also creates the
  # mattermost-test bucket used by the filestore test suite.
  rustfs-init:
    image: rustfs/rc:v0.1.31
    container_name: lms-dev-rustfs-init
    profiles:
      - setup
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        set -e;
        rc alias set local http://rustfs:9000 rustfsaccesskey rustfssecretkey;
        rc ready local --timeout 10;
        rc mb --ignore-existing local/lms-dev;
        rc mb --ignore-existing local/mattermost-test;
        echo '>> buckets ready';
      "

  prometheus:
    image: prom/prometheus:latest
    container_name: lms-dev-prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    volumes:
      - ../../observability/prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  lms-dev-pgdata:
  lms-dev-rustfsdata:
