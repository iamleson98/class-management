# Prometheus scrape configuration for the LMS backend.
# The backend exposes Prometheus metrics on :8067
# (MM_METRICSSETTINGS_LISTENADDRESS, enabled via MM_METRICSSETTINGS_ENABLE=true).
global:
  scrape_interval: 15s
  evaluation_interval: 60s

scrape_configs:
  - job_name: "lms-server"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["lms-server:8067"]
        labels:
          service: "lms-server"

  # Self-monitor Prometheus
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
