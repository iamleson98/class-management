# LMS CI — tests and image build validation for the fork's own code.
#
# Trigger: pull requests and manual dispatch. Master pushes do NOT run this —
# the LMS Deploy workflow rebuilds everything from source on every master
# push anyway, so a second test pass would only duplicate work.
#
# Jobs (each is skipped — cheaply — when its code paths did not change):
#   changes    path filter; every other job gates on its outputs
#   server     Go: build, vet, unit tests (calls suite with -race,
#              public model suite)
#   rtcd       Go: build + vet + tests (builds against the fork's public
#              module via the replace directives in rtcd/go.mod)
#   frontend   bun: lint (non-blocking), unit tests, API-proxy tests,
#              production build with the same-origin sentinel,
#              run-server.js integration test
#   images     docker build of all three production images (no push) —
#              validates the Dockerfiles
#
# The upstream Mattermost workflows that came with the fork were removed;
# this is the only test workflow this repository uses.
name: LMS CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: lms-ci-${{ github.event_name == 'pull_request' && github.event.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # paths-filter@v4 resolves pull_request change sets via the GitHub API
  # (GET /repos/.../pulls/N/files); without this scope it fails with
  # "Resource not accessible by integration".
  pull-requests: read

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "24"

jobs:
  # ── Path filter ─────────────────────────────────────────────────────
  # Every job below gates on these outputs so a frontend-only PR does not
  # burn Go build minutes (and vice versa). The filter job itself is a
  # few seconds; skipped downstream jobs report as neutral, not failed.
  # NOTE: `master` pushes never reach this workflow, so a filter base of
  # origin/master is always available on PRs.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      rtcd: ${{ steps.filter.outputs.rtcd }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            server:
              - "server/**"
            rtcd:
              # rtcd/go.mod replace directives point at ../server — server
              # changes can break the rtcd build too.
              - "rtcd/**"
              - "server/**"
              - "deploy/images/rtcd*"
            frontend:
              - "lms-fe/**"
            docker:
              - "server/Dockerfile"
              - "lms-fe/Dockerfile"
              - "deploy/images/**"
              - "lms-fe/**"
              - "server/**"
              - "rtcd/**"

  # ── Backend (Go) ────────────────────────────────────────────────────
  server:
    name: Server (Go)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: server/go.sum

      - name: Build
        run: go build ./...

      - name: Vet (calls + API surface)
        run: go vet ./channels/calls/... ./channels/api4/...

      - name: Test calls suite (race detector)
        run: go test -race -count=1 ./channels/calls/...

      # public/ is its own Go module (github.com/iamleson98/sitename/server/public),
      # so the model suite must run from server/public, not from server/.
      - name: Test public model suite
        run: |
          cd public
          go test -count=1 ./model/...

  # ── rtcd SFU (Go) ───────────────────────────────────────────────────
  rtcd:
    name: rtcd SFU (Go)
    needs: changes
    if: needs.changes.outputs.rtcd == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rtcd
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          # rtcd/go.mod replaces the fork's server modules with ../server —
          # both go.sum files feed the cache key.
          cache-dependency-path: |
            rtcd/go.sum
            server/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

  # ── Frontend (Next.js) ──────────────────────────────────────────────
  frontend:
    name: Frontend (Next.js)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: lms-fe
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Non-blocking: the repo carries pre-existing lint findings unrelated
      # to the deploy pipeline; new code should not add more (fix the debt,
      # then flip this to blocking).
      - name: Lint
        run: bun run lint
        continue-on-error: true

      - name: Unit tests
        run: bun run test

      # The runtime /api/v4 reverse proxy (REST + WebSocket upgrade relay)
      # that makes a separately-deployed frontend work. Runs under Node —
      # the container runtime (Bun cannot hijack upgrade sockets).
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: API proxy tests
        run: node scripts/test-api-proxy.cjs

      # Build with the same sentinel the production image bakes in — proves
      # the domain-agnostic build is valid on every PR.
      - name: Production build (same-origin sentinel)
        run: bun run build
        env:
          NEXT_PUBLIC_API_URL: /

      # Boots the REAL production entry (run-server.js) against a stub
      # backend and verifies REST proxying, the WebSocket upgrade relay
      # (cookie included) and graceful SIGTERM.
      - name: run-server.js integration test
        run: node scripts/test-integration-run-server.cjs

  # ── Production Dockerfiles (build only, no push) ────────────────────
  images:
    name: Image — ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # lms-server builds from the REPO ROOT: server/go.mod has a
          # replace directive pointing at ../rtcd — the context must
          # contain both server/ and rtcd/.
          - name: lms-server
            context: .
            file: server/Dockerfile
          - name: lms-fe
            context: lms-fe
            file: lms-fe/Dockerfile
          # rtcd builds from the REPO ROOT: rtcd/go.mod has replace
          # directives pointing at ../server, so the context must include it.
          - name: lms-rtcd
            context: .
            file: deploy/images/rtcd.Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.name }} (no push)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: ${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
