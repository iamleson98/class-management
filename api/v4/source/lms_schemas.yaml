        type: array
        items:
          $ref: "#/components/schemas/LmsWhereCond"

  # ---------- Generic SearchOpts building blocks ----------
  # All listing endpoints accept a POST body built from utils.SearchOpts[T]:
  #   where_ands / where_ors : list of column conditions (ANDed / ORed)
  #   orderings              : list of { column, dir } ordering rules
  #   limit / offset         : pagination
  #   count_total            : if true, response includes the unfiltered total count
  LmsWhereCond:
    type: object
    description: A single WHERE condition in a SearchOpts filter body.
    properties:
      column:
        type: string
        description: Database column name (e.g. "classes.status").
      value:
        description: The value to compare against (type depends on the column).
      operator:
        type: string
        description: SQL comparison operator.
        enum: ["=", "<>", ">", "<", ">=", "<=", "IN", "NOT IN", "LIKE", "ILIKE", "NOT LIKE", "NOT ILIKE"]
    required: [column, value, operator]

  LmsOrdering:
    type: object
    description: A single ORDER BY rule in a SearchOpts filter body.
    properties:
      column:
        type: string
      dir:
        type: string
        description: ASC or DESC
        enum: [ASC, DESC]
    required: [column, dir]

  # ---------- Entity FilterOpts ----------
  # Each listing endpoint references its FilterOpts schema. They all embed the
  # generic SearchOpts fields; some add an optional free-text `search` field.
  LmsBranchFilterOpts:
    allOf:
      - $ref: "#/components/schemas/LmsSearchOptsBase"

  LmsClassFilterOpts:
    allOf:
      - $ref: "#/components/schemas/LmsSearchOptsBase"
      - type: object
        properties:
          search:
            type: string
            description: Free-text search on class name.

  LmsSessionFilterOpts:
    allOf:
      - $ref: "#/components/schemas/LmsSearchOptsBase"

  LmsLeadFilterOpts:
    allOf:
      - $ref: "#/components/schemas/LmsSearchOptsBase"
      - type: object
        properties:
          search:
            type: string
            description: Free-text search on lead name, email, phone.

  LmsFeePackageFilterOpts:
    allOf:
      - $ref: "#/components/schemas/LmsSearchOptsBase"

  LmsTuitionFilterOpts:
    allOf:
      - $ref: "#/components/schemas/LmsSearchOptsBase"
      - type: object
        properties:
          search:
            type: string
            description: Free-text search on student name.

  LmsPaymentFilterOpts:
    allOf:
      - $ref: "#/components/schemas/LmsSearchOptsBase"

  LmsBlogPostFilterOpts:
    allOf:
      - $ref: "#/components/schemas/LmsSearchOptsBase"

  LmsWeeklyReviewFilterOpts:
