  LmsTaskFilterOpts:
    allOf:
      - $ref: "#/components/schemas/LmsSearchOptsBase"

  LmsMaterialFilterOpts:
    allOf:
      - $ref: "#/components/schemas/LmsSearchOptsBase"

  # Base fields shared by every FilterOpts (mirrors utils.SearchOpts).
  LmsSearchOptsBase:
    type: object
    description: Generic SearchOpts fields embedded by every FilterOpts body.
    properties:
      where_ands:
        type: array
        items:
          $ref: "#/components/schemas/LmsWhereCond"
      where_ors:
        type: array
        items:
          $ref: "#/components/schemas/LmsWhereCond"
      orderings:
        type: array
        items:
          $ref: "#/components/schemas/LmsOrdering"
      limit:
        type: integer
        description: Max items to return. Only applied when > 0.
      offset:
        type: integer
        description: Number of items to skip. Only applied when >= 0.
      count_total:
        type: boolean
        description: If true, the response includes the unfiltered total count.

