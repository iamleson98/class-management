# Prometheus scrape configuration for the LMS Swarm deployment.
#
# Service names resolve over the lms_overlay network (Docker DNS):
#   lms-server :8067 — Mattermost-style metrics (MM_METRICSSETTINGS_*)
#   lms-rtcd   :8045 — rtcd SFU metrics (same port as the control API)
#
# Note: with replicas > 1, service DNS round-robins between tasks; Prometheus
# discovers them via the service name and relabels by instance as usual.
global:
  scrape_interval: 15s
  evaluation_interval: 60s

scrape_configs:
  - job_name: "lms-server"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["lms-server:8067"]
        labels:
          service: "lms-server"

  - job_name: "lms-rtcd"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["lms-rtcd:8045"]
        labels:
          service: "lms-rtcd"
      # Second SFU instance: uncomment when the pool is active
      # (RTCD2_REPLICAS=1) so its metrics are scraped too.
      # - targets: ["lms-rtcd2:8045"]
      #   labels:
      #       service: "lms-rtcd2"

  # Self-monitor Prometheus
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
