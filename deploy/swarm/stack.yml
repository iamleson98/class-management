# Docker Swarm stack for the LMS system on Contabo servers.
#
# Components:
#   traefik      edge reverse proxy (TLS via Let's Encrypt, Swarm provider)
#   postgres     backend database
#   rustfs       S3-compatible object storage for file uploads
#   rustfs-init  one-shot: creates the upload bucket (retries until rustfs is up)
#   lms-server   Go backend (REST + WebSocket :8065, metrics :8067)
#   lms-fe       Next.js frontend (:3000)
#   lms-rtcd     WebRTC SFU (control :8045 internal, media :8443 host mode)
#   node-exporter host metrics (global — one per node)
#   cadvisor     per-container metrics (global — one per node)
#   postgres-exporter PostgreSQL internals
#   blackbox-exporter synthetic probes (api ping, frontend)
#   prometheus   metrics scraper (10-day retention, recording rules)
#   grafana      provisioned dashboards + alerts
#
# Images are pulled from GitHub Container Registry (ghcr.io) — see
# .github/workflows/lms-deploy.yml and deploy/swarm/build-and-push.sh.
# Deploy with --with-registry-auth so worker nodes can pull:
#   docker stack deploy -c stack.yml --with-registry-auth lms
#
# ── Placement model ──────────────────────────────────────────────────────
# Every stateful/heavy service has an env-driven placement constraint that
# defaults to "node.role == manager" — a SINGLE-NODE swarm works out of the
# box. For a multi-node Contabo cluster, override in .env, e.g.:
#   DB_PLACEMENT=node.labels.role == db
#   RUSTFS_PLACEMENT=node.labels.role == db
#   RTCD_PLACEMENT=node.labels.role == video
#   BACKEND_PLACEMENT=node.labels.role == backend
# (Tag nodes with: docker node update --label-add role=db <node>)
#
# ── Networking model ─────────────────────────────────────────────────────
# Public (internet → node):
#   80/443       traefik, Swarm routing mesh (ingress VIP)
#   8443 tcp+udp rtcd ICE media, HOST mode on the video node (WebRTC media
#                must terminate on the node whose public IP is advertised in
#                ICE candidates; ingress VIPs break host-candidate matching)
# Internal (overlay only, never published):
#   postgres:5432, rustfs:9000/:9001, rtcd:8045, lms-server:8065/:8067
#
# ── Secrets model ────────────────────────────────────────────────────────
# Created once by secrets-bootstrap.sh (docker secret create); each appears
# at /run/secrets/<name>. postgres and grafana read *_FILE natively; rustfs
# reads RUSTFS_*_FILE natively; lms-server reads them via its entrypoint
# shim (SECRETS_MAP) because the server has no *_FILE convention.
#
# ── TLS / routing ────────────────────────────────────────────────────────
# Traefik terminates TLS (Let's Encrypt TLS-ALPN challenge):
#   https://${APP_SUBDOMAIN}.${DOMAIN}     frontend (Next.js). ALL /api/v4 traffic
#                                    (REST + the calls WebSocket) is proxied
#                                    BY THE FRONTEND SERVER to LMS_BACKEND_URL
#                                    — run-server.js relays the WS upgrade
#                                    over a raw socket pair, so the browser
#                                    stays same-origin and the httpOnly
#                                    MMAUTHTOKEN cookie rides REST and WS
#                                    alike. This is what makes a SEPARATELY
#                                    DEPLOYED frontend work: set LMS_BACKEND_URL
#                                    to the backend's origin (any host, any
#                                    domain) and the auth model is unchanged.
#   https://${API_SUBDOMAIN}.${DOMAIN}     backend API (direct access: mmctl,
#                                    integrations, admin tooling). CORS below
#                                    also allows the frontend origin for direct
#                                    cross-origin API clients.
#   https://${S3_SUBDOMAIN}.${DOMAIN}      rustfs console (login-protected; remove
#                                    these labels to keep it internal-only)
#   https://${GRAFANA_SUBDOMAIN}.${DOMAIN}  Grafana (admin password from secret)
#   https://${TRAEFIK_SUBDOMAIN}.${DOMAIN}  Traefik dashboard (basic auth)
#
# Hostname scheme: each service gets "${<SVC>_SUBDOMAIN:-<svc>}.${DOMAIN}" so
# deployments with non-obvious prefixes (e.g. lms / lms-api / lms-s3 under
# sitename.me) work without touching this file. Defaults keep the classic
# app./api./s3./grafana./traefik. scheme.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-rollback-on-failure: &stateless-update
  update_config:
    parallelism: 1
    order: start-first     # zero-downtime for stateless services
    failure_action: rollback
  rollback_config:
    parallelism: 1
    order: start-first

x-stop-first-update: &stateful-update
  # stop-first: stateful services must release ports/volumes before the
  # replacement task starts (host-mode ports and single-writer volumes).
  update_config:
    parallelism: 1
    order: stop-first
    failure_action: pause
  rollback_config:
    parallelism: 1
    order: stop-first

services:
  # ───────────────────────── Edge / TLS ──────────────────────────────
  traefik:
    image: traefik:v3.7.12
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
      - target: 443
        published: 443
        protocol: tcp
        mode: ingress
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Redirect all HTTP → HTTPS
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # Swarm service discovery. Labels are read from deploy.labels (NOT
      # service-level labels — a classic Swarm gotcha).
      - --providers.swarm=true
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.network=lms_overlay
      # Let's Encrypt (TLS-ALPN: works when only 443 can be opened)
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?set ACME_EMAIL in .env}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
      # Dashboard + healthcheck
      - --api.dashboard=true
      - --ping=true
      # Trust forwarded headers only from the Swarm network
      - --entrypoints.websecure.forwardedHeaders.insecure=false
      # Sensible timeouts for long-lived WebSocket connections (chat + calls
      # signaling). Values are generous: Mattermost websockets idle-ping
      # every ~25s, so 15m is a safe ceiling.
      - --entrypoints.websecure.transport.respondingTimeouts.idleTimeout=15m
      - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=15m
      - --entrypoints.websecure.transport.respondingTimeouts.writeTimeout=15m
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
    volumes:
      # Swarm provider needs the manager's docker socket (read-only).
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    networks: [lms_overlay]
    logging: *default-logging
    deploy:
      replicas: 1
      placement:
        constraints: ["node.role == manager"]
      resources:
        limits: { cpus: "1.0", memory: 256M }
      labels:
        - traefik.enable=true
        # Deterministic backend network (traefik is also attached to ingress
        # for its published 80/443; without this it may pick the wrong one).
        - traefik.docker.network=lms_overlay
        # The swarm provider auto-builds a service for this container from
        # the swarm service name ("lms-traefik"); published mesh ports are
        # NOT on the overlay interface, so it errors "port is missing" and
        # drops ALL labels on this container (incl. the dashboard router,
        # whose cert then never gets issued). Give the auto-service a port —
        # nothing routes to it (the dashboard uses api@internal).
        - traefik.http.services.lms-traefik.loadbalancer.server.port=8080
        # Dashboard at https://traefik.<domain> behind basic auth.
        - traefik.http.routers.traefik.rule=Host(`${TRAEFIK_SUBDOMAIN:-traefik}.${DOMAIN:?set DOMAIN in .env}`)
        - traefik.http.routers.traefik.entrypoints=websecure
        - traefik.http.routers.traefik.tls.certresolver=le
        - traefik.http.routers.traefik.service=api@internal
        - traefik.http.routers.traefik.middlewares=traefik-auth
        # htpasswd string, e.g. admin:$$apr1$$... (generate: htpasswd -nB admin)
        - traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_AUTH:?set TRAEFIK_AUTH in .env}
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─────────────────────────── Database ──────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mmuser}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${POSTGRES_DB:-mattermost}
      # Deterministic locale; avoids collation drift across node rebuilds.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
      TZ: ${TZ:-UTC}
    secrets: [db_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [lms_overlay]
    logging: *default-logging
    deploy:
      <<: *stateful-update
      replicas: 1
      placement:
        constraints: ["${DB_PLACEMENT:-node.role == manager}"]
      resources:
        limits:
          cpus: "${DB_CPUS:-2.0}"
          memory: "${DB_MEM:-1G}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mmuser} -d ${POSTGRES_DB:-mattermost}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ─────────────────────── Object storage (S3) ───────────────────────
  # RustFS: S3-compatible object storage (Apache-2.0, Rust). Replaces MinIO.
  # The S3 API stays INTERNAL (only lms-server reaches it over the overlay);
  # files are served to browsers through the backend API, which keeps the
  # bucket fully private. The console (login-protected) is exposed at
  # s3.<domain> — delete the traefik labels below to keep it internal too.
  rustfs:
    image: rustfs/rustfs:1.0.0-rc.4
    environment:
      # Native Docker-secrets support (reads the files, passes to the binary).
      RUSTFS_ACCESS_KEY_FILE: /run/secrets/rustfs_access_key
      RUSTFS_SECRET_KEY_FILE: /run/secrets/rustfs_secret_key
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: "warn"
      # SSE-S3 (AES256) at-rest encryption requires a 32-byte base64 key
      # when no KMS is configured. Only needed if MM_FILESETTINGS_AMAZONS3SSE
      # is enabled on lms-server. Create via:
      #   docker secret create rustfs_sse_s3_master_key <(python3 -c \
      #     "import base64,os; print(base64.b64encode(os.urandom(32)).decode())")
      # then uncomment the secrets entry below.
      # RUSTFS_SSE_S3_MASTER_KEY_FILE: /run/secrets/rustfs_sse_s3_master_key
    secrets: [rustfs_access_key, rustfs_secret_key]
    volumes:
      - rustfs_data:/data
    networks: [lms_overlay]
    logging: *default-logging
    deploy:
      <<: *stateful-update
      replicas: 1
      placement:
        constraints: ["${RUSTFS_PLACEMENT:-node.role == manager}"]
      resources:
        limits: { cpus: "1.0", memory: 512M }
      labels:
        # Console at https://s3.<domain> (auth = the rustfs access/secret key)
        - traefik.enable=true
        - traefik.docker.network=lms_overlay
        - traefik.http.services.rustfs-console.loadbalancer.server.port=9001
        - traefik.http.routers.rustfs-console.rule=Host(`${S3_SUBDOMAIN:-s3}.${DOMAIN}`)
        - traefik.http.routers.rustfs-console.entrypoints=websecure
        - traefik.http.routers.rustfs-console.tls.certresolver=le
    healthcheck:
      # Alpine base → busybox wget; /health is the documented liveness probe.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot bucket creator. Swarm ignores depends_on, so it retries until
  # rustfs answers, then exits 0. Idempotent (mb --ignore-existing).
  # rustfs/rc is the official RustFS S3 CLI (mc-compatible: alias set / mb /
  # anonymous). Replaces the previous minio/mc bootstrap.
  rustfs-init:
    image: rustfs/rc:v0.1.31
    entrypoint: >
      /bin/sh -c "
      set -e;
      RC_ACCESS=$$(cat /run/secrets/rustfs_access_key);
      RC_SECRET=$$(cat /run/secrets/rustfs_secret_key);
      echo '>> waiting for rustfs S3 API...';
      n=0;
      until rc alias set local http://rustfs:9000 "$$RC_ACCESS" "$$RC_SECRET" >/dev/null 2>&1; do
        n=$$((n+1));
        if [ $$n -ge 60 ]; then echo '!! rustfs unreachable after 60 tries' >&2; exit 1; fi;
        sleep 2;
      done;
      rc ready local --timeout 10;
      rc mb --ignore-existing local/${MM_FILESETTINGS_AMAZONS3BUCKET:-lms-uploads};
      echo '>> bucket ready';
      "
    secrets: [rustfs_access_key, rustfs_secret_key]
    networks: [lms_overlay]
    logging: *default-logging
    deploy:
      replicas: 1
      restart_policy:
        condition: none

  # ──────────────────────────── Backend ──────────────────────────────
  lms-server:
    image: ${REGISTRY_PREFIX:-ghcr.io/iamleson98}/lms-server:${TAG:?set TAG in .env}
    # Explicit 'server' subcommand overrides the image CMD: pre-fix images
    # carry CMD ["sitename"], which the entrypoint shim appends as an
    # ARGUMENT (exec sitename sitename -> cobra "unknown command"). Also
    # future-proof: (a) an EMPTY command ([]) is dropped by docker stack's
    # compose interpretation (Args=null -> image CMD still applies), while a
    # real subcommand reliably overrides it; (b) 'sitename server' is the
    # same code path as the root no-args default (RootCmd.RunE = serverCmdF).
    command: server
    environment:
      # ── Database ──
      # DSN (password inside) is assembled by secrets-bootstrap.sh into the
      # db_dsn secret; the entrypoint shim exports it as this env var.
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_MAXCONNS: ${MM_SQLSETTINGS_MAXCONNS:-40}
      # ── File storage → rustfs (the AWS SDK v2 backend uses path-style
      #    addressing for non-AWS endpoints automatically) ──
      MM_FILESETTINGS_DRIVERNAME: amazons3
      # Access key ID + secret key are BOTH read from /run/secrets/rustfs_*_key
      # by the entrypoint shim (SECRETS_MAP below): the access key ID is
      # random ("lms-<hex>", generated by secrets-bootstrap.sh), so it
      # cannot be a static env var here.
      MM_FILESETTINGS_AMAZONS3BUCKET: ${MM_FILESETTINGS_AMAZONS3BUCKET:-lms-uploads}
      MM_FILESETTINGS_AMAZONS3ENDPOINT: http://rustfs:9000
      MM_FILESETTINGS_AMAZONS3SSL: "false"
      MM_FILESETTINGS_AMAZONS3REGION: us-east-1
      # ── Site ──
      # SiteURL is the user-facing origin (the app). CORS is OFF by default:
      # the app talks same-origin through the frontend's /api/v4 proxy, so no
      # cross-origin request ever needs it. Set MM_SERVICESETTINGS_ALLOWCORSFROM
      # (space-separated full origins, e.g. "https://app.other-domain.com")
      # ONLY when direct cross-origin clients must reach this backend — e.g.
      # a frontend that bypasses the proxy, mmctl, integrations. (Nested
      # ${A:-${B}} defaults are not supported by docker stack interpolation,
      # hence no app.${DOMAIN} default here.)
      MM_SERVICESETTINGS_SITEURL: https://${APP_SUBDOMAIN:-app}.${DOMAIN}
      MM_SERVICESETTINGS_ALLOWCORSFROM: ${MM_SERVICESETTINGS_ALLOWCORSFROM:-""}
      MM_SERVICESETTINGS_CORSALLOWCREDENTIALS: "true"
      MM_SERVICESETTINGS_ALLOWEDUNTRUSTEDINTERNALCONNECTIONS: "rustfs,postgres,rtcd"
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_SERVICESETTINGS_TRUSTPROXYIPADDRESS: "true"
      MM_SERVICESETTINGS_ENABLECUSTOMEMOJI: "true"
      # ── Calls (native control plane + rtcd SFU) ──
      # SFU pool: the backend resolves this URL via DNS and keeps ONE control
      # connection per resolved IP, assigning new calls across the pool (and
      # re-resolving every 10s — scaled-up rtcd instances are picked up
      # without a backend restart). Default: the single lms-rtcd service. For
      # a multi-node pool set it to http://rtcd-pool:8045 (the shared network
      # alias of lms-rtcd + lms-rtcd2 + …) in .env.
      MM_CALLSSETTINGS_RTCDSERVICEURL: ${MM_CALLSSETTINGS_RTCDSERVICEURL:-http://rtcd:8045}
      MM_CALLSSETTINGS_ENABLE: "true"
      MM_CALLSSETTINGS_MAXCALLPARTICIPANTS: ${MM_CALLSSETTINGS_MAXCALLPARTICIPANTS:-0}
      # ICE servers handed to BROWSERS in the join ack (empty default is
      # correct: rtcd is on a public IP and browsers reach it with host
      # candidates). Add STUN/TURN for restrictive networks, e.g.
      #   stun:stun.example.net:3478
      #   turn:user:secret@turn.example.net:3478?transport=tcp
      # (full guidance: DEPLOY.md, "Calls in production — ICE/TURN".)
      MM_CALLSSETTINGS_ICESERVERS: ${MM_CALLSSETTINGS_ICESERVERS:-""}
      # ── Metrics ──
      MM_METRICSSETTINGS_ENABLE: "true"
      MM_METRICSSETTINGS_LISTENADDRESS: ":8067"
      # ── Logging ──
      MM_LOGSETTINGS_CONSOLEJSON: "false"
      MM_LOGSETTINGS_CONSOLELEVEL: ${MM_LOGSETTINGS_CONSOLELEVEL:-INFO}
      MM_LOGSETTINGS_FILEENABLELOGGING: "false"
      # ── Misc ──
      TZ: ${TZ:-UTC}
      MM_NO_DOCKER: "true"
      MM_INSTALL_TYPE: docker
      # Tell the entrypoint shim which secret maps to which env var.
      SECRETS_MAP: "MM_SQLSETTINGS_DATASOURCE=db_dsn MM_FILESETTINGS_AMAZONS3ACCESSKEYID=rustfs_access_key MM_FILESETTINGS_AMAZONS3SECRETACCESSKEY=rustfs_secret_key"
    secrets: [db_dsn, rustfs_access_key, rustfs_secret_key]
    networks: [lms_overlay]
    logging: *default-logging
    deploy:
      <<: *stateless-update
      replicas: ${BACKEND_REPLICAS:-1}
      placement:
        constraints: ["${BACKEND_PLACEMENT:-node.role == manager}"]
      resources:
        limits:
          cpus: "${BACKEND_CPUS:-2.0}"
          memory: "${BACKEND_MEM:-1536M}"
      labels:
        # API at https://api.<domain> (direct access for mmctl/integrations).
        # APP traffic does NOT use this router: the frontend service proxies
        # /api/v4 (REST + the calls WebSocket) itself, keeping the browser
        # same-origin with the httpOnly cookie — see the lms-fe service.
        - traefik.enable=true
        - traefik.docker.network=lms_overlay
        - traefik.http.services.lms-server.loadbalancer.server.port=8065
        - traefik.http.routers.lms-server.rule=Host(`${API_SUBDOMAIN:-api}.${DOMAIN}`)
        - traefik.http.routers.lms-server.entrypoints=websecure
        - traefik.http.routers.lms-server.tls.certresolver=le
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8065/api/v4/system/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ──────────────────────────── Frontend ─────────────────────────────
  # Domain-agnostic image: NEXT_PUBLIC_API_URL is baked as "/" (same-origin
  # sentinel) and the browser talks to /api/v4 (REST + WebSocket) on its own
  # origin; run-server.js proxies that namespace to LMS_BACKEND_URL at
  # RUNTIME — including the WebSocket upgrade, which is what keeps calls
  # working when the frontend is deployed separately from the backend.
  lms-fe:
    image: ${REGISTRY_PREFIX:-ghcr.io/iamleson98}/lms-fe:${TAG:?set TAG in .env}
    environment:
      NODE_ENV: production
      # Where the frontend server proxies /api/v4 (REST + WS). Point this at
      # ANY reachable backend origin — the Swarm service above by default, or
      # a backend on a different host entirely (separated deployment).
      LMS_BACKEND_URL: ${LMS_BACKEND_URL:-http://lms-server:8065}
      TZ: ${TZ:-UTC}
    networks: [lms_overlay]
    logging: *default-logging
    deploy:
      <<: *stateless-update
      replicas: ${FRONTEND_REPLICAS:-1}
      placement:
        constraints: ["${FRONTEND_PLACEMENT:-node.role == manager}"]
      resources:
        limits:
          cpus: "${FRONTEND_CPUS:-1.0}"
          memory: "${FRONTEND_MEM:-512M}"
      labels:
        # App at https://app.<domain>
        - traefik.enable=true
        - traefik.docker.network=lms_overlay
        - traefik.http.services.lms-fe.loadbalancer.server.port=3000
        - traefik.http.routers.lms-fe.rule=Host(`${APP_SUBDOMAIN:-app}.${DOMAIN}`)
        - traefik.http.routers.lms-fe.entrypoints=websecure
        - traefik.http.routers.lms-fe.tls.certresolver=le
    # Healthcheck inherited from the image (fetches its own root page).

  # ─────────────────────────── Calls SFU ─────────────────────────────
  # rtcd: WebRTC SFU. The control API (:8045) is reachable ONLY inside the
  # overlay — the lms-server self-registers as a client on first connect.
  # Media (:8443 UDP/TCP) is published in HOST mode on the video node so the
  # advertised ICE host candidate (RTCD_ICE_HOST_OVERRIDE = the node's PUBLIC
  # IP) matches the socket that actually terminates media. Ingress-VIP
  # publishing would break ICE host-candidate matching.
  # Scale-out (see DEPLOY.md "Scaling the SFU pool"): every lms-rtcd*
  # service carries the SAME network alias "rtcd-pool" with dnsrr endpoint
  # mode, so the alias resolves to all live task IPs; point
  # MM_CALLSSETTINGS_RTCDSERVICEURL at http://rtcd-pool:8045 to use it. The
  # backend discovers new instances within ~10s of them coming up.
  lms-rtcd:
    image: ${REGISTRY_PREFIX:-ghcr.io/iamleson98}/lms-rtcd:${RTCD_TAG:-latest}
    environment:
      RTCD_API_LISTEN: ":8045"
      RTCD_ALLOW_SELF_REGISTRATION: "true"
      RTCD_ICE_HOST_OVERRIDE: ${RTCD_ICE_HOST_OVERRIDE:?set RTCD_ICE_HOST_OVERRIDE to the video node PUBLIC IP}
      RTCD_ICE_PORT_UDP: "${RTCD_MEDIA_PORT:-8443}"
      RTCD_ICE_PORT_TCP: "${RTCD_MEDIA_PORT:-8443}"
      # rtcd's OWN ICE servers (public-IP discovery when ice_host_override
      # is empty, and its outbound gathering). Decoupled from
      # MM_CALLSSETTINGS_ICESERVERS, which is what BROWSERS receive.
      RTCD_ICE_SERVERS: ${RTCD_ICE_SERVERS:-stun:stun.l.google.com:19302}
      RTCD_DATA_SOURCE: /data/rtcd_db
      RTCD_LOG_LEVEL: ${RTCD_LOG_LEVEL:-INFO}
      TZ: ${TZ:-UTC}
    ports:
      - target: 8443
        published: ${RTCD_MEDIA_PORT:-8443}
        protocol: udp
        mode: host
      - target: 8443
        published: ${RTCD_MEDIA_PORT:-8443}
        protocol: tcp
        mode: host
    volumes:
      - rtcd_data:/data
    networks:
      lms_overlay:
        # 'rtcd' alias is REQUIRED: with endpoint_mode dnsrr the swarm DNS
        # only registers the stack-prefixed service name (lms_lms-rtcd) —
        # the compose short name does NOT resolve (SERVFAIL) unlike VIP
        # services. lms-server's MM_CALLSSETTINGS_RTCDSERVICEURL default
        # points at http://rtcd:8045. 'rtcd-pool' is the shared alias for
        # multi-instance scale-out.
        aliases: [rtcd, rtcd-pool]
    logging: *default-logging
    deploy:
      # stop-first: two tasks cannot bind the same host-mode media port.
      <<: *stateful-update
      replicas: 1
      placement:
        constraints: ["${RTCD_PLACEMENT:-node.role == manager}"]
      resources:
        limits:
          cpus: "${RTCD_CPUS:-2.0}"
          memory: "${RTCD_MEM:-1G}"
      # dnsrr: DNS for "rtcd" (and the shared "rtcd-pool" alias) resolves to
      # the TASK IP, which is what the backend's per-host rtcd client pool
      # needs. Host-mode port publishing is compatible with dnsrr.
      # (endpoint_mode lives under deploy — a top-level key is rejected.)
      endpoint_mode: dnsrr
    # Healthcheck inherited from the image (GET /version on :8045).

  # ── Optional second SFU instance (multi-node scale-out) ──
  # Inert by default (0 replicas). To activate (DEPLOY.md "Scaling the SFU
  # pool"): label a second video node (docker node update --label-add rtcd=2
  # <node>), set RTCD2_ICE_HOST_OVERRIDE to ITS public IP, RTCD2_REPLICAS=1,
  # and MM_CALLSSETTINGS_RTCDSERVICEURL=http://rtcd-pool:8045, then redeploy.
  # The backend discovers the new instance within ~10s and spreads new calls
  # across the pool. Each instance keeps its own registration volume.
  lms-rtcd2:
    image: ${REGISTRY_PREFIX:-ghcr.io/iamleson98}/lms-rtcd:${RTCD_TAG:-latest}
    environment:
      RTCD_API_LISTEN: ":8045"
      RTCD_ALLOW_SELF_REGISTRATION: "true"
      RTCD_ICE_HOST_OVERRIDE: ${RTCD2_ICE_HOST_OVERRIDE:-}
      RTCD_ICE_PORT_UDP: "${RTCD_MEDIA_PORT:-8443}"
      RTCD_ICE_PORT_TCP: "${RTCD_MEDIA_PORT:-8443}"
      RTCD_ICE_SERVERS: ${RTCD_ICE_SERVERS:-stun:stun.l.google.com:19302}
      RTCD_DATA_SOURCE: /data/rtcd_db
      RTCD_LOG_LEVEL: ${RTCD_LOG_LEVEL:-INFO}
      TZ: ${TZ:-UTC}
    ports:
      - target: 8443
        published: ${RTCD_MEDIA_PORT:-8443}
        protocol: udp
        mode: host
      - target: 8443
        published: ${RTCD_MEDIA_PORT:-8443}
        protocol: tcp
        mode: host
    volumes:
      - rtcd2_data:/data
    networks:
      lms_overlay:
        aliases: [rtcd-pool]
    logging: *default-logging
    deploy:
      <<: *stateful-update
      replicas: ${RTCD2_REPLICAS:-0}
      placement:
        constraints: ["${RTCD2_PLACEMENT:-node.labels.rtcd == 2}"]
      resources:
        limits:
          cpus: "${RTCD2_CPUS:-2.0}"
          memory: "${RTCD2_MEM:-1G}"
      endpoint_mode: dnsrr

  # ──────────────────────── Observability ────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=10d
    volumes:
      - promdata:/prometheus
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
      - source: prometheus_rules
        target: /etc/prometheus/rules/lms-rules.yml
    networks: [lms_overlay]
    logging: *default-logging
    deploy:
      <<: *stateful-update
      replicas: 1
      placement:
        constraints: ["node.role == manager"]
      resources:
        limits: { cpus: "0.5", memory: 512M }

  # Host metrics from every node (mode: global = one task per node).
  # Scraped via tasks.node-exporter:9100 so Prometheus sees all instances.
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.8.2
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks: [lms_overlay]
    logging: *default-logging
    deploy:
      mode: global
      resources:
        limits: { cpus: "0.2", memory: 128M }

  # Per-container metrics from every node. Needs privileged + /dev/kmsg
  # for cgroup v2 hosts (Contabo default).
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    command:
      - --docker_only
      - --housekeeping_interval=30s
    networks: [lms_overlay]
    logging: *default-logging
    deploy:
      mode: global
      resources:
        limits: { cpus: "0.4", memory: 256M }

  # PostgreSQL internals (cache hit ratio, dead tuples, table sizes).
  # Credentials come from the db_password secret via the exporter's
  # *_FILE env support — no plaintext password in the environment.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:-mattermost}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER:-mmuser}
      DATA_SOURCE_PASS_FILE: /run/secrets/db_password
    secrets: [db_password]
    networks: [lms_overlay]
    logging: *default-logging
    deploy:
      <<: *stateless-update
      replicas: 1
      placement:
        constraints: ["${DB_PLACEMENT:-node.role == manager}"]
      resources:
        limits: { cpus: "0.2", memory: 128M }

  # Synthetic probes: backend /api/v4/system/ping + frontend /.
  blackbox-exporter:
    image: quay.io/prometheus/blackbox-exporter:v0.25.0
    networks: [lms_overlay]
    logging: *default-logging
    deploy:
      <<: *stateless-update
      replicas: 1
      resources:
        limits: { cpus: "0.1", memory: 64M }

  grafana:
    image: grafana/grafana:10.4.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD_FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://${GRAFANA_SUBDOMAIN:-grafana}.${DOMAIN}
      # Cost/noise reduction: no phone-home telemetry, quieter logs.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATE: "false"
      GF_LOG_LEVEL: warn
      TZ: ${TZ:-UTC}
    secrets: [grafana_admin_password]
    volumes:
      - grafana-data:/var/lib/grafana
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/prometheus.yml
      - source: grafana_dashboards_provider
        target: /etc/grafana/provisioning/dashboards/dashboards.yml
      - source: grafana_alerts
        target: /etc/grafana/provisioning/alerting/alerts.yml
      - source: grafana_dash_overview
        target: /var/lib/grafana/dashboards/lms-overview.json
      - source: grafana_dash_system
        target: /var/lib/grafana/dashboards/lms-system.json
      - source: grafana_dash_containers
        target: /var/lib/grafana/dashboards/lms-containers.json
      - source: grafana_dash_api
        target: /var/lib/grafana/dashboards/lms-http-api.json
      - source: grafana_dash_chat
        target: /var/lib/grafana/dashboards/lms-chat-ws.json
      - source: grafana_dash_uploads
        target: /var/lib/grafana/dashboards/lms-uploads.json
      - source: grafana_dash_database
        target: /var/lib/grafana/dashboards/lms-database.json
      - source: grafana_dash_business
        target: /var/lib/grafana/dashboards/lms-business.json
      - source: grafana_dash_calls
        target: /var/lib/grafana/dashboards/lms-calls.json
    networks: [lms_overlay]
    logging: *default-logging
    deploy:
      <<: *stateless-update
      replicas: 1
      placement:
        constraints: ["node.role == manager"]
      resources:
        limits: { cpus: "0.5", memory: 512M }
      labels:
        # Grafana at https://grafana.<domain>
        - traefik.enable=true
        - traefik.docker.network=lms_overlay
        - traefik.http.services.grafana.loadbalancer.server.port=3000
        - traefik.http.routers.grafana.rule=Host(`${GRAFANA_SUBDOMAIN:-grafana}.${DOMAIN}`)
        - traefik.http.routers.grafana.entrypoints=websecure
        - traefik.http.routers.grafana.tls.certresolver=le

networks:
  lms_overlay:
    # Explicit name: without it Swarm prefixes the network with the stack
    # name ("lms_lms_overlay"), which Traefik's swarm provider then fails to
    # match against the network referenced in labels/services (it "defaults
    # to the first available network" — the ingress for port-published
    # services — and routing breaks with "port is missing").
    name: lms_overlay
    driver: overlay
    attachable: true
    # Encrypted overlay: inter-node VXLAN is wrapped in IPsec (AES), because
    # the swarm fabric rides the PUBLIC internet (Contabo has no VPC/private
    # NIC product). Swarm control traffic (2377/7946) is TLS regardless; this
    # encrypts the DATA plane — the lms-server<->rtcd control channel and any
    # cross-node service traffic.
    # MTU: VXLAN costs 50 bytes, the IPsec ESP wrapper ~60 more. On a
    # 1500-MTU underlay, 1380 is safe for both (raise to 1450 ONLY if you
    # remove encryption). Over a private network with a smaller MTU (e.g. a
    # vSwitch/VLAN at 1400), lower accordingly.
    # NOTE: `encrypted` and MTU apply at network CREATION. On an existing
    # stack: docker stack rm lms, remove the lms_lms_overlay network, then
    # redeploy. Fresh deployments need nothing.
    driver_opts:
      encrypted: "true"
      com.docker.network.driver.mtu: "1380"

volumes:
  traefik_certs: {}
  pgdata: {}
  rustfs_data: {}
  rtcd_data: {}
  rtcd2_data: {}
  promdata: {}
  grafana-data: {}

# ──────────────────────────── Secrets ────────────────────────────────
# External: created by secrets-bootstrap.sh BEFORE the first deploy.
secrets:
  db_password:
    external: true
  db_dsn:
    external: true
  rustfs_access_key:
    external: true
  rustfs_secret_key:
    external: true
  grafana_admin_password:
    external: true

# ──────────────────────────── Configs ────────────────────────────────
# Mounted as read-only files at the target paths. Source files are read from
# the manager's filesystem at deploy time (deploy.sh runs from deploy/swarm/).
configs:
  prometheus_config:
    file: ./configs/prometheus.yml
  prometheus_rules:
    file: ../../observability/prometheus-rules.yml
  grafana_datasource:
    file: ../../observability/grafana/provisioning/datasources/prometheus.yml
  grafana_dashboards_provider:
    file: ../../observability/grafana/provisioning/dashboards/dashboards.yml
  grafana_alerts:
    file: ../../observability/grafana/provisioning/alerting/alerts.yml
  grafana_dash_overview:
    file: ../../observability/grafana/dashboards/lms-overview.json
  grafana_dash_system:
    file: ../../observability/grafana/dashboards/lms-system.json
  grafana_dash_containers:
    file: ../../observability/grafana/dashboards/lms-containers.json
  grafana_dash_api:
    file: ../../observability/grafana/dashboards/lms-http-api.json
  grafana_dash_chat:
    file: ../../observability/grafana/dashboards/lms-chat-ws.json
  grafana_dash_uploads:
    file: ../../observability/grafana/dashboards/lms-uploads.json
  grafana_dash_database:
    file: ../../observability/grafana/dashboards/lms-database.json
  grafana_dash_business:
    file: ../../observability/grafana/dashboards/lms-business.json
  grafana_dash_calls:
    file: ../../observability/grafana/dashboards/lms-calls.json
